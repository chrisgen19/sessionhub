name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sessionhub
          POSTGRES_PASSWORD: sessionhub_ci
          POSTGRES_DB: sessionhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sessionhub -d sessionhub_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://sessionhub:sessionhub_ci@localhost:5432/sessionhub_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:db
      - run: pnpm build
      - name: Install Chromium for extension E2E
        run: pnpm --filter @sessionhub/extension exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/extension/test-results
          retention-days: 7

  docker:
    # Builds the production images and tests the compose stack (infra/docker/compose.yaml).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:docker
      - name: Compose logs on failure
        if: failure()
        run: docker compose -p sessionhub-smoke -f infra/docker/compose.yaml logs --no-color || true

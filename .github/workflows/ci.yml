name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a PR replaces its run. A run on main is never cancelled once it has started,
  # but GitHub keeps only one waiting run per group: when three or more PRs merge in quick
  # succession, the runs still waiting in between are cancelled. Nothing goes untested or
  # undeployed, because the newest run tests and deploys main with every earlier merge in it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sessionhub
          # Throwaway database for this job only: no password, so none sits in the repo (as restore-drill.sh does).
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sessionhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sessionhub -d sessionhub_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://sessionhub@localhost:5432/sessionhub_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:db
      - name: Test encrypted backup and isolated restore (including failure paths)
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
          bash infra/scripts/test-backup.sh "$POSTGRES_CONTAINER" sessionhub_test

  # The two Playwright suites run as separate jobs, side by side. Locally `pnpm test:e2e` still
  # runs them one after the other (turbo.json), so they don't compete for one machine.
  e2e-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter=@sessionhub/extension
      - name: Install Chromium for extension E2E
        run: pnpm --filter @sessionhub/extension exec playwright install --with-deps chromium
      - run: pnpm --filter @sessionhub/extension test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-extension
          path: apps/extension/test-results
          retention-days: 7

  e2e-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sessionhub
          # Throwaway database for this job only: no password, so none sits in the repo (as restore-drill.sh does).
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sessionhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sessionhub -d sessionhub_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31.3
        ports: ["58025:8025"]
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://sessionhub@localhost:5432/sessionhub_test
      TEST_MAILPIT_URL: http://localhost:58025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Playwright's global setup migrates the test database and builds its own copy of the extension.
      - run: pnpm build --filter=@sessionhub/web
      - name: Install Chromium for web E2E
        run: pnpm --filter @sessionhub/web exec playwright install --with-deps chromium
      - run: pnpm --filter @sessionhub/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-web
          path: apps/web/test-results
          retention-days: 7

  extension-zip:
    # The Chrome Web Store ZIP, built twice to prove it is reproducible, then checked by
    # apps/extension/scripts/check-release-zip.ts (docs/DEPLOYMENT.md section 6). The server it
    # talks to is the repository variable EXTENSION_API_BASE_URL (the production BETTER_AUTH_URL);
    # without it the build targets https://sessionhub.invalid, which never resolves, and nothing is uploaded.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WXT_API_BASE_URL: ${{ vars.EXTENSION_API_BASE_URL || 'https://sessionhub.invalid' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sessionhub/extension zip:release
      - uses: actions/upload-artifact@v4
        if: vars.EXTENSION_API_BASE_URL != ''
        with:
          name: sessionhub-extension-${{ github.sha }}
          path: apps/extension/.output/sessionhub-*-chrome.zip
          # .output is a dot directory, which upload-artifact skips unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  docker:
    # Builds the production images and tests the compose stack (infra/docker/compose.yaml).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:docker
      - name: Compose logs on failure
        if: failure()
        run: docker compose -p sessionhub-smoke -f infra/docker/compose.yaml logs --no-color || true

  deploy:
    # Ships main to Coolify only after every check has passed (docs/DEPLOYMENT.md section 8).
    # Coolify's own auto-deploy is off, so merging is what deploys. Until the repository
    # secrets exist, this skips with a notice instead of failing.
    needs: [check, e2e-extension, e2e-web, extension-zip, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the Coolify deployment
        env:
          WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ] || [ -z "$TOKEN" ]; then
            echo "::notice::COOLIFY_DEPLOY_WEBHOOK or COOLIFY_TOKEN isn't set, so nothing was deployed."
            exit 0
          fi
          status=$(curl -sS -X POST -o body.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$WEBHOOK")
          cat body.json
          echo
          test "$status" = "200" || { echo "Coolify returned HTTP $status"; exit 1; }

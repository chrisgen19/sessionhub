packages:
  - apps/*
  - packages/*

# Prisma's install scripts: a Node version check (prisma) and the engine download
# from binaries.prisma.sh (@prisma/engines) that `prisma migrate` needs.
allowBuilds:
  '@prisma/engines': true
  prisma: true

# vitest declares jsdom as an optional peer; keep auto-installed peers on the version the extension tests use.
overrides:
  jsdom: 30.1.2
